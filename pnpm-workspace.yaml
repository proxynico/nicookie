packages:
  - "packages/*"
  - "apps/*"

# Wait seven days before installing a newly published package version: nicookie reads browser cookies.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false

overrides:
  esbuild: 0.28.2

onlyBuiltDependencies:
  - esbuild
