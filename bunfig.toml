# nicookie reads browser cookies, so installs wait seven days before taking a newly
# published package version.
[install]
minimumReleaseAge = 604800 # seconds

[test]
coverageSkipTestFiles = true
# Bun holds every file to this floor. It only rises: when the lowest file improves,
# raise it to that file's new measure.
coverageThreshold = { lines = 0.98, functions = 1.0 }
