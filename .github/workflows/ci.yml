name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push replaces a pull request's run. Each merge to main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    # macOS, because nicookie reads macOS stores and Bun uses the system SQLite there.
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
      - name: Recheck every locked version's release age
        run: bun scripts/check-release-age.mjs
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun audit --audit-level=high
